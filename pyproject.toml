[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerlens"
version = "0.1.0"
description = "End-to-end AI analyst for SEC filings: RAG, fine-tuning, guardrails, evals, deployment, monitoring"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "fastembed>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ledgerlens-ingest = "ledgerlens.ingest.cli:main"
ledgerlens-index = "ledgerlens.retrieval.index:main"
ledgerlens-search = "ledgerlens.retrieval.search:main"
ledgerlens-eval-retrieval = "ledgerlens.retrieval.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
