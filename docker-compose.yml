services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ledgerlens-db
    environment:
      POSTGRES_USER: ledgerlens
      POSTGRES_PASSWORD: ledgerlens
      POSTGRES_DB: ledgerlens
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerlens"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
